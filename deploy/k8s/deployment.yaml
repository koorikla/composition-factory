apiVersion: apps/v1
kind: Deployment
metadata:
  name: compositionfactory
  labels:
    app.kubernetes.io/name: compositionfactory
    app.kubernetes.io/component: canvas
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: compositionfactory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compositionfactory
        app.kubernetes.io/component: canvas
    spec:
      initContainers:
        - name: populate-cache
          image: compositionfactory
          command:
            - cf
            - provider
            - add
            - ghcr.io/crossplane-contrib/provider-aws-iam:v2.7.0
            - --cache-dir
            - /home/cf/.cache/compositionfactory
          volumeMounts:
            - name: cache
              mountPath: /home/cf/.cache/compositionfactory
      containers:
        - name: compositionfactory
          image: compositionfactory
          command:
            - cf
            - serve
            - --blueprint
            - /workspace/blueprints/irsa.cf.yaml
            - --addr
            - 0.0.0.0:8080
            - --i-know-this-is-unauthenticated
            - --out
            - /workspace/out
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: blueprints
              mountPath: /workspace/blueprints
            - name: cache
              mountPath: /home/cf/.cache/compositionfactory
            - name: out
              mountPath: /workspace/out
      volumes:
        - name: blueprints
          configMap:
            name: cf-blueprints
        - name: cache
          emptyDir: {}
        - name: out
          emptyDir: {}
