apiVersion: v1
kind: ConfigMap
metadata:
  name: cf-blueprints
  labels:
    app.kubernetes.io/name: compositionfactory
    app.kubernetes.io/component: canvas
data:
  xqueue.cf.yaml: |
    apiVersion: factory.crossplane.io/v1alpha1
    kind: Blueprint
    metadata:
      name: xqueue
    spec:
      sources:
        - provider: ghcr.io/crossplane-contrib/provider-aws-sqs:v2.7.0
      xrd:
        group: platform.sparky.ee
        kind: XQueue
        plural: xqueues
        version: v1alpha1
        scope: Namespaced
        parameters:
          location:
            type: string
            required: true
            enum: [EU, US]
          providerName:
            type: string
            required: true
          maxMessageSize:
            type: integer
            required: true
            default: "2048"
      resources:
        - name: main-queue
          kind: Queue
          provider: ghcr.io/crossplane-contrib/provider-aws-sqs:v2.7.0
          fields:
            region: {value: eu-north-1}
            maxMessageSize: {from: params.maxMessageSize}
        - name: queue-policy
          kind: QueuePolicy
          provider: ghcr.io/crossplane-contrib/provider-aws-sqs:v2.7.0
          fields:
            region: {value: eu-north-1}
            queueUrl: {from: resources.main-queue.status.atProvider.url}
            policy: {value: '{"Version": "2012-10-17", "Statement": []}'}

  irsa.cf.yaml: |
    # IRSA — IAM Roles for Service Accounts, the canonical cross-family wire.
    #
    # One blueprint composes both halves of the EKS IRSA handshake:
    #
    #   - an AWS IAM Role (a managed resource from provider-aws-iam) whose trust
    #     policy lets the cluster's OIDC provider issue it to one ServiceAccount;
    #   - the native Kubernetes ServiceAccount itself, whose
    #     eks.amazonaws.com/role-arn annotation must carry the Role's ARN.
    #
    # The ARN only exists once AWS has created the Role, so the annotation is a
    # cross-resource status wire: `from: resources.role.status.atProvider.arn`.
    # The generated Composition guards it with the hasKey chain every status wire
    # gets — on the first reconcile (Role not yet observed) the ServiceAccount
    # renders WITHOUT the annotation key, cleanly, and Crossplane fills it in on
    # a later reconcile once the Role reports its ARN. Never an empty value,
    # never "<no value>".
    apiVersion: factory.crossplane.io/v1alpha1
    kind: Blueprint
    metadata:
      name: irsa
    spec:
      sources:
        - provider: ghcr.io/crossplane-contrib/provider-aws-iam:v2.7.0
      xrd:
        group: platform.sparky.ee
        kind: XIrsa
        plural: xirsas
        version: v1alpha1
        scope: Namespaced
        parameters:
          providerName:
            type: string
            required: true
            description: ProviderConfig to reconcile the composed resources against.
          oidcProviderArn:
            type: string
            required: true
            description: ARN of the cluster's IAM OIDC provider (arn:aws:iam::<account>:oidc-provider/<issuer>).
          team:
            type: string
            default: platform
            description: Owning team — lands in every object's tags via the cf.tags convention.
          sessionSeconds:
            type: integer
            default: "3600"
            description: Maximum session duration for the assumed role, in seconds.
          automountToken:
            type: boolean
            default: "true"
            description: Whether the ServiceAccount auto-mounts its API token.
      # The trust policy is a template so it stays ONE declaration: a real
      # AssumeRoleWithWebIdentity document, scoped to exactly one ServiceAccount
      # subject. Two mechanics worth naming:
      #
      #   - the OIDC issuer is derived from the provider ARN (everything after
      #     ":oidc-provider/"), so the XR carries one ARN, not the ARN plus a
      #     second, silently-divergent issuer string;
      #   - the body's output is wrapped in single quotes, which is what makes
      #     the rendered assumeRolePolicy a JSON *string* — unquoted, YAML would
      #     read the {...} as a mapping and the API server would reject it
      #     against the CRD's type: string.
      #
      # The subject's namespace is the XR's OWN namespace (.xrMeta.namespace —
      # composed native objects land there anyway), never a parameter; the
      # ServiceAccount subject is named after the XR (.xr is the composite's
      # metadata.name) — the convention this demo's SA resource follows too.
      templates:
        trust-policy: >-
          '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"{{ .spec.oidcProviderArn }}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"{{ regexReplaceAll "^.*:oidc-provider/" .spec.oidcProviderArn "" }}:sub":"system:serviceaccount:{{ .xrMeta.namespace }}:{{ .xr }}"}}}]}'
        # The reusable tag map: applied by convention to every managed object
        # that has a top-level `tags` and doesn't set it explicitly (native
        # objects are structural and are skipped by design). The team input
        # flows into every tagged object from ONE declaration.
        cf.tags: |
          managed-by: crossplane
          team: {{ .spec.team | quote }}
          xr: {{ .xr | quote }}
      conventions:
        - {match: tags, template: cf.tags}
      resources:
        # The IAM Role: a managed resource, full Crossplane envelope
        # (providerConfigRef derived from providerName), trust policy from the
        # template above.
        - name: role
          kind: Role
          provider: ghcr.io/crossplane-contrib/provider-aws-iam:v2.7.0
          fields:
            description: {value: IAM role assumed by a Kubernetes ServiceAccount via IRSA}
            assumeRolePolicy: {template: trust-policy}
            maxSessionDuration: {from: params.sessionSeconds}
        - name: role-policy
          kind: RolePolicy
          provider: ghcr.io/crossplane-contrib/provider-aws-iam:v2.7.0
          fields:
            role: {from: resources.role.status.atProvider.id}
            policy: {raw: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:ListBucket"],"Resource":["arn:aws:s3:::*"]}]}'}
        # The ServiceAccount: a native Kubernetes object — no forProvider, no
        # providerConfigRef, the composed document IS the ServiceAccount. Its
        # role-arn annotation is the wire this whole blueprint exists for.
        - name: sa
          kind: ServiceAccount
          provider: k8s
          fields:
            automountServiceAccountToken: {from: params.automountToken}
          annotations:
            eks.amazonaws.com/role-arn: {from: resources.role.status.atProvider.arn}
