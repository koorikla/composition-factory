# staticcheck configuration for compositionfactory.
#
# Everything staticcheck offers is on, with one deliberate exception.
#
# ST1005 ("error strings should not be capitalized / should not end with
# punctuation") is off because this engine's errors are its user interface.
# A field path that does not exist in a provider CRD, a `from:` wire onto a
# composite parameter, or a template call on a native Kubernetes kind are all
# author mistakes a person has to act on, so the errors are written as full
# sentences that name what is wrong and why it matters, and several quote the
# YAML the author should write instead (`... set the whole node with raw:`).
# Reflowing them into lowercase fragments without terminal punctuation would
# cost real explanatory value and would rewrite strings the test suite pins.
# Capitalised leading words that remain are Crossplane proper nouns
# (`Configuration package has no ...`).
# "inherit" is staticcheck's own default set (all checks minus the
# naming/doc-comment stylistic ones, which this repo's per-file header
# comments would trip on every file).
checks = ["inherit", "-ST1005"]
