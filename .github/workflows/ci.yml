name: ci
on: [push, pull_request]
jobs:
  # Lane A runs everywhere and catches malformed output fast.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: '1.25' }
      - run: make lint
      - run: make test

  # Lane B needs a Docker daemon; crossplane render runs the engine in containers.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: '1.25' }
      - name: Install crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/main/install.sh | sh
          sudo mv crossplane /usr/local/bin/
      # CF_REQUIRE_ACCEPTANCE=1 turns every prerequisite skip in
      # acceptance_test.go into a hard failure. Without it this job goes
      # green whether or not the acceptance test actually ran: a skip is
      # reported as a pass, so a silently-failed crossplane CLI install or an
      # unavailable Docker daemon would leave the one gate that proves the
      # generated YAML renders quietly doing nothing. This is Lane B's
      # assertion that it RAN, not merely that it did not fail.
      - run: make test-docker
        env:
          CF_REQUIRE_ACCEPTANCE: '1'

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify Docker build
        run: docker build .

