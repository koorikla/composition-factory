name: ci
on: [push, pull_request]
jobs:
  # Lane A runs everywhere and catches malformed output fast.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26" }
      - run: make lint
      - run: make lint-strict
      - run: make test
      - run: make test-race

  # Lane B needs a Docker daemon; crossplane render runs the engine in containers.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26" }
      - name: Install crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/main/install.sh | sh
          sudo mv crossplane /usr/local/bin/
      - run: make test-docker
        env:
          CF_REQUIRE_ACCEPTANCE: "1"

  # Lane C: Playwright behavior suite over web-proto/ with isolated cf serve.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/main/install.sh | sh
          sudo mv crossplane /usr/local/bin/
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make test-e2e

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify Docker build
        run: docker build .

  # Lane C: in-cluster verification on real kind + Crossplane.
  cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26" }
      - uses: azure/setup-helm@v4
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Create cluster with Crossplane and functions
        run: make cluster
      - name: Run in-cluster test
        run: make test-cluster

