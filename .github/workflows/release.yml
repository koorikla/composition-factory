name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build and Package Cross-Platform Binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          
          for target in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64"; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            out="dist/cf_${os}_${arch}${ext}"
            echo "Building $out (version $VERSION)..."
            
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/cf
            
            archive_name="compositionfactory_${VERSION}_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd dist && zip "${archive_name}.zip" "cf_${os}_${arch}${ext}")
            else
              (cd dist && tar -czvf "${archive_name}.tar.gz" "cf_${os}_${arch}")
            fi
          done
          
          (cd dist && sha256sum compositionfactory_* > checksums.txt)

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: |
            dist/compositionfactory_*
            dist/checksums.txt

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub Release
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: dist

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --title "compositionfactory ${GITHUB_REF_NAME}" \
            --notes "$(cat <<'EOF'
          ## Docker Image

          ```sh
          docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          docker pull ghcr.io/${{ github.repository }}:latest
          ```

          Run the visual canvas UI (create a blueprint first — see README):
          ```sh
          docker run --rm -p 8080:8080 \
            -v $(pwd):/workspace \
            -v cf-cache:/home/cf/.cache/compositionfactory \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            serve --blueprint xqueue.cf.yaml --addr 0.0.0.0:8080 --i-know-this-is-unauthenticated
          ```

          ### Pre-compiled Binaries
          Multi-platform binaries and `checksums.txt` are attached below.
          EOF
          )"

