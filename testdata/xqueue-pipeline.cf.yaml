apiVersion: factory.crossplane.io/v1alpha1
kind: Blueprint
metadata:
  name: xqueue-pipeline
spec:
  sources:
    - provider: ghcr.io/crossplane-contrib/provider-aws-sqs:v2.7.0
  xrd:
    group: platform.sparky.ee
    kind: XQueue
    plural: xqueues
    version: v1alpha1
    scope: Namespaced
    parameters:
      location:       {type: string, required: true, enum: [EU, US]}
      providerName:   {type: string, required: true}
      maxMessageSize: {type: integer, default: "2048"}
  resources:
    - name: main-queue
      kind: Queue
      provider: ghcr.io/crossplane-contrib/provider-aws-sqs:v2.7.0
      fields:
        region:         {value: "eu-north-1"}
        maxMessageSize: {from: params.maxMessageSize}
  # The declared pipeline replaces the generator's default auto-ready step
  # with an explicit one -- the overwhelmingly common declared-pipeline case:
  # the templating step, then function-auto-ready from the OSS registry.
  pipeline:
    - name: auto-ready
      functionRef: function-auto-ready
      package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.5.1
