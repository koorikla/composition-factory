apiVersion: factory.crossplane.io/v1alpha1
kind: Blueprint
metadata:
  name: irsa
spec:
  sources:
    - provider: ghcr.io/crossplane-contrib/provider-aws-iam:v2.7.0
  xrd:
    group: platform.sparky.ee
    kind: XIrsa
    plural: xirsas
    version: v1alpha1
    scope: Namespaced
    parameters:
      providerName:
        type: string
        required: true
        description: ProviderConfig to reconcile the composed resources against.
      oidcProviderArn:
        type: string
        required: true
        description: ARN of the cluster's IAM OIDC provider (arn:aws:iam::<account>:oidc-provider/<issuer>).
      team:
        type: string
        default: platform
        description: Owning team — lands in every object's tags via the cf.tags convention.
      serviceAccountName:
        type: string
        default: sa
        description: Name of the Kubernetes ServiceAccount to bind with IAM IRSA.
      description:
        type: string
        default: IAM role assumed by a Kubernetes ServiceAccount via IRSA
        description: Description metadata for the provisioned IAM Role.
      automountToken:
        type: boolean
        default: "true"
        description: Whether the ServiceAccount auto-mounts its API token.
  templates:
    trust-policy: >-
      '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"{{ .spec.oidcProviderArn }}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"{{ regexReplaceAll "^.*:oidc-provider/" .spec.oidcProviderArn "" }}:sub":"system:serviceaccount:{{ .xrMeta.namespace }}:{{ default .xr .spec.serviceAccountName }}"}}}]}'
    cf.tags: |
      managed-by: crossplane
      team: {{ .spec.team | quote }}
      xr: {{ .xr | quote }}
  conventions:
    - {match: tags, template: cf.tags}
  resources:
    - name: role
      kind: Role
      provider: ghcr.io/crossplane-contrib/provider-aws-iam:v2.7.0
      fields:
        description: {from: params.description}
        assumeRolePolicy: {template: trust-policy}
    - name: role-policy
      kind: RolePolicy
      provider: ghcr.io/crossplane-contrib/provider-aws-iam:v2.7.0
      fields:
        role: {from: resources.role.status.atProvider.id}
        policy: {raw: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:ListBucket"],"Resource":["arn:aws:s3:::*"]}]}'}
    - name: sa
      kind: ServiceAccount
      provider: k8s
      fields:
        automountServiceAccountToken: {from: params.automountToken}
      annotations:
        eks.amazonaws.com/role-arn: {from: resources.role.status.atProvider.arn}
        eks.amazonaws.com/sts-regional-endpoints: {value: "true"}
