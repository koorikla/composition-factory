apiVersion: factory.crossplane.io/v1alpha1
kind: Blueprint
metadata:
  name: external-secrets
spec:
  sources: []
  xrd:
    group: security.sparky.ee
    kind: XExternalSecretStore
    plural: xexternalsecretstores
    version: v1alpha1
    scope: Namespaced
    parameters:
      providerName:
        type: string
        required: true
        description: ProviderConfig reference to reconcile against.
      storeType:
        type: string
        default: Vault
        enum:
          - Vault
          - AWSSecretsManager
          - AzureKeyVault
          - GCPSecretManager
        description: External Secrets Operator backend vault provider type.
      remoteKey:
        type: string
        required: true
        description: Remote secret key path in the external vault.
      refreshInterval:
        type: string
        default: 1h
        description: Refresh interval for synchronizing secrets from vault.
  resources:
    - name: config
      kind: ConfigMap
      provider: k8s
      fields:
        data[STORE_TYPE]: {from: params.storeType}
        data[REFRESH_INTERVAL]: {from: params.refreshInterval}
      annotations:
        external-secrets.io/store-type: {from: params.storeType}
        external-secrets.io/refresh-interval: {from: params.refreshInterval}
    - name: secret
      kind: Secret
      provider: k8s
      fields:
        stringData[INITIAL_TOKEN]: {value: "uninitialized"}
      annotations:
        external-secrets.io/managed: {value: "true"}
        external-secrets.io/remote-key: {from: params.remoteKey}
        external-secrets.io/refresh-interval: {from: params.refreshInterval}
